<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Birthday Invite</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: url("background.png") no-repeat center center fixed;
        background-size: cover;
        height: 100vh;
        overflow: hidden;
    }

    /* container for buttons */
    .buttons {
        position: absolute;
        bottom: 30px;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    /* icon buttons */
    .btn {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        border: none;
        font-size: 24px;
        cursor: pointer;
        background: rgba(255,255,255,0.85);
        transition: 0.2s;
    }

    .btn:hover {
        transform: scale(1.1);
        background: white;
    }

    /* popup background */
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.6);
        justify-content: center;
        align-items: center;
    }

    /* popup box */
    .modal-content {
        background: white;
        padding: 20px;
        border-radius: 10px;
        width: 80%;
        max-width: 500px;
        text-align: center;
    }

    .close {
        margin-top: 10px;
        padding: 8px 12px;
        border: none;
        cursor: pointer;
        background: black;
        color: white;
        border-radius: 5px;
    }
</style>
</head>

<body>

<!-- BUTTONS -->
<div class="buttons">

    <button class="btn" onclick="openModal(1)">🍕</button>
    <button class="btn" onclick="openModal(2)">🎮</button>
    <button class="btn" onclick="openModal(3)">🎂</button>
    <button class="btn" onclick="openModal(4)">🎁</button>
    <button class="btn" onclick="openModal(5)">📍</button>
    <button class="btn" onclick="openModal(6)">🕒</button>
    <button class="btn" onclick="openModal(7)">🚪</button>
    <button class="btn" onclick="openModal(8)">📜</button>
    <button class="btn" onclick="openModal(9)">🎉</button>
    <button class="btn" onclick="openModal(10)">💃</button>
    <button class="btn" onclick="openModal(11)">😈</button>

</div>

<!-- MODALS -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div id="modal-text">Content</div>
        <br>
        <button class="close" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
const content = {
    1: "🍕 Food section (add image/video here later)",
    2: "🎮 Games section",
    3: "🎂 Birthday vibes",
    4: "🎁 Surprise!",
    5: "📍 Location info",
    6: "🕒 Time details",
    7: "🚪 Entry rules",
    8: "📜 Party rules",
    9: "🎉 Celebration info",
    10: "💃 Dancing section",
    11: "😈 Secret final message"
};

function openModal(id) {
    document.getElementById("modal-text").innerHTML = content[id];
    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
