<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Birthday Invite</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #000;
    }

    /* poster wrapper */
    .page {
        position: relative;
        width: 100%;
    }

    /* background image */
    .background {
        width: 100%;
        height: auto;
        display: block;
    }

    /* overlay layer for buttons */
    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    .canvas {
    position: relative;
    width: 100%;
    max-width: 1000px;   /* keeps layout stable on PC */
    margin: 0 auto;
}

/* image defines the coordinate system */
.background {
    width: 100%;
    height: auto;
    display: block;
}

/* overlay perfectly matches image */
.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

    /* button base */
    .btn {
        position: absolute;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: none;
        font-size: 22px;
        cursor: pointer;

        background: #c9a0ff; /* light purple */
        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        transition: 0.25s ease;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn:hover {
        transform: scale(1.15);
        background: #b184ff;
    }

    /* ===== POPUP ===== */

    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.65);

        justify-content: center;
        align-items: center;
    }

    .modal-content {
    width: 80%;
    max-width: 800px;
    height: 400px;

    background: white;
    border-radius: 12px;
    overflow: hidden;

    display: flex;

    opacity: 1;
    transform: translateY(0px);
}


    /* left video side */
    .modal-left {
        flex: 1;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    /* right caption side */
    .modal-right {
        flex: 1;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        text-align: center;
    }

    /* close button */
    .close {
        position: absolute;
        top: 10px;
        right: 15px;
        background: black;
        color: white;
        border: none;
        padding: 6px 10px;
        cursor: pointer;
        border-radius: 6px;
    }

    /* soft float in animation */
@keyframes floatIn {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0px);
    }
}
    @keyframes floatOut {
    from {
        opacity: 1;
        transform: translateY(0px);
    }
    to {
        opacity: 0;
        transform: translateY(25px);
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="canvas">
        <img src="background.png" class="background" />

        <div class="overlay">

        <!-- BUTTONS (positions are placeholders for now) -->
        <button class="btn" style="top:65%; left:10%;" onclick="openModal(1)">⭐</button>
        <button class="btn" style="top:65%; left:25%;" onclick="openModal(2)">🕺</button>
        <button class="btn" style="top:65%; left:40%;" onclick="openModal(3)">🎧</button>
        <button class="btn" style="top:65%; left:55%;" onclick="openModal(4)">🧥</button>
        
        <button class="btn" style="top:70%; left:10%;" onclick="openModal(5)">💬</button>
        <button class="btn" style="top:70%; left:25%;" onclick="openModal(6)">🔠</button>
        <button class="btn" style="top:70%; left:40%;" onclick="openModal(7)">🎤</button>
        <button class="btn" style="top:70%; left:55%;" onclick="openModal(8)">🍔</button>
        
        <button class="btn" style="top:75%; left:17.5%;" onclick="openModal(9)">📖</button>
        <button class="btn" style="top:75%; left:32.5%;" onclick="openModal(10)">🎯</button>
        <button class="btn" style="top:75%; left:47.5%;" onclick="openModal(11)">🎁</button>
        

        </div>
    </div>
    

    
</div>

<!-- POPUP -->
<div id="modal" class="modal">
    <div class="modal-content">

        <button class="close" onclick="closeModal()">X</button>

        <div class="modal-left">
            <video id="popupVideo" width="100%" height="100%" controls></video>
        </div>

        <div class="modal-right">
            <div id="modal-title"></div>
            <div id="modal-body"></div>
        </div>

    </div>
</div>

<script>
const content = {
    1: {
        video: "videos/metal.mp4",
        title: "VAMOS A ROCKEAR!!",
        body: "😝😝😝"
    },
    2: {
        video: "videos/nosferatu.mp4",
        title: "Vamos a bailar :b",
        body: "💃💃💃💃"
    },
    3: {
        video: "videos/n33.mp4",
        caption: "Vamos a esuchar música de calidad🔥"
    },
    4: {
        video: "videos/asiComo.mp4",
        caption: "No hay código de vestimenta, pueden ser Carlos. 👍"
    },
    5: {
        video: "videos/cartman.mp4",
        caption: "Todo tipo de chiste está permitido.👍"
    },
    6: {
        video: "videos/polo.mp4",
        caption: "Me hablan en español o SE LARGAN.‼️‼️"
    },
    7: {
        video: "videos/xfactor.mp4",
        caption: "Vamos a cantar!!🎤🎤"
    },
    8: {
        video: "videos/finn.mp4",
        title: "MENU: Choripan.", 
        body: "Qué es un choripan? Un chorizo dentro de un pan. Una bendición.🫦"
    },
    9: {
        video: "videos/profvenezuela.mp4",
        title: "Acuérdense de la cartelera de foami con los 12 valores.",
        body: "Si hay algún desacuerdo, por decreto real, habrá una pelea de pulgares.👍👍"
    },
    10: {
        video: "videos/mcdonalds.mp4",
        title: "La musica está estrictamente bajo el control de la cumpleañera‼️‼️⚠️⚠️.", 
        body: "El/la que ose poner canciones sin permiso y además, nicherías como bad bunny, manuel chorizo o un vallenato, se queda sin torta y sin choripan."
    },
    11: {
        video: "videos/keyboardcat.mp4",
        title: "Los regalos no son necesarios!!",
        body: "Su presencia es el mayor regalo que la cumpleañera podría tener en su día especial, los quiere mucho a todos <3"
    }
};

function openModal(id) {
    const modal = document.getElementById("modal");
    const box = document.querySelector(".modal-content");
    const video = document.getElementById("popupVideo");

    const data = content[id];

    // title + body
    document.getElementById("modal-title").innerText = data.title;
    document.getElementById("modal-body").innerText = data.body;

    // video (unchanged)
    video.src = data.video;
    video.currentTime = 0;
    video.play();

    modal.style.display = "flex";

    box.style.animation = "none";
    box.offsetHeight;
    box.style.animation = "floatIn 0.45s ease-out forwards";
}

function closeModal() {
    const modal = document.getElementById("modal");
    const box = document.querySelector(".modal-content");
    const video = document.getElementById("popupVideo");

    video.pause();
    video.src = "";

    box.style.animation = "floatOut 0.35s ease-in forwards";

    setTimeout(() => {
        modal.style.display = "none";
        box.style.animation = "none";
    }, 350);
}
</script>

</body>
</html>
