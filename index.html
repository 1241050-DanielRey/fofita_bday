<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Birthday Invite</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #000;
    }

    /* poster wrapper */
    .page {
        position: relative;
        width: 100%;
    }

    /* background image */
    .background {
        width: 100%;
        height: auto;
        display: block;
    }

    /* overlay layer for buttons */
    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    /* button base */
    .btn {
        position: absolute;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: none;
        font-size: 22px;
        cursor: pointer;

        background: #c9a0ff; /* light purple */
        color: white;

        display: flex;
        align-items: center;
        justify-content: center;

        transition: 0.25s ease;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn:hover {
        transform: scale(1.15);
        background: #b184ff;
    }

    /* ===== POPUP ===== */

    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.65);

        justify-content: center;
        align-items: center;
    }

   /* popup content */
.modal-content {
    width: 80%;
    max-width: 800px;
    height: 400px;

    background: white;
    border-radius: 12px;
    overflow: hidden;

    display: flex;

    /* initial hidden state */
    opacity: 0;
    transform: scale(0.92);
    filter: blur(6px);

    animation: magicReveal 0.5s ease-out forwards;
}


    /* left video side */
    .modal-left {
        flex: 1;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    /* right caption side */
    .modal-right {
        flex: 1;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        text-align: center;
    }

    /* close button */
    .close {
        position: absolute;
        top: 10px;
        right: 15px;
        background: black;
        color: white;
        border: none;
        padding: 6px 10px;
        cursor: pointer;
        border-radius: 6px;
    }

   /* MAGIC REVEAL */
@keyframes magicReveal {
    0% {
        opacity: 0;
        transform: scale(0.92);
        filter: blur(8px);
    }

    60% {
        opacity: 1;
        transform: scale(1.02);
        filter: blur(2px);
    }

    100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0px);
    }
}
</style>
</head>

<body>

<div class="page">

    <img src="background.png" class="background" />

    <div class="overlay">

        <!-- BUTTONS (positions are placeholders for now) -->
        <button class="btn" style="top:80%; left:10%;" onclick="openModal(1)">⭐</button>
        <button class="btn" style="top:75%; left:20%;" onclick="openModal(2)">🕺</button>
        <button class="btn" style="top:78%; left:30%;" onclick="openModal(3)">🎧</button>
        <button class="btn" style="top:82%; left:40%;" onclick="openModal(4)">🧥</button>
        <button class="btn" style="top:76%; left:50%;" onclick="openModal(5)">💬</button>
        <button class="btn" style="top:80%; left:60%;" onclick="openModal(6)">🈯</button>
        <button class="btn" style="top:77%; left:70%;" onclick="openModal(7)">📶</button>
        <button class="btn" style="top:83%; left:15%;" onclick="openModal(8)">🍔</button>
        <button class="btn" style="top:84%; left:25%;" onclick="openModal(9)">📖</button>
        <button class="btn" style="top:79%; left:75%;" onclick="openModal(10)">🎯</button>
        <button class="btn" style="top:81%; left:85%;" onclick="openModal(11)">🎁</button>

    </div>
</div>

<!-- POPUP -->
<div id="modal" class="modal">
    <div class="modal-content">

        <button class="close" onclick="closeModal()">X</button>

        <div class="modal-left">
            VIDEO HERE
        </div>

        <div class="modal-right" id="modal-text">
            TEXT HERE
        </div>

    </div>
</div>

<script>
const content = {
    1: "Star section",
    2: "Dance section",
    3: "Music section",
    4: "Clothes section",
    5: "Talking section",
    6: "Language section",
    7: "Signal section",
    8: "Burger section",
    9: "Book section",
    10: "Target section",
    11: "Gift section"
};

function openModal(id) {
    const modal = document.getElementById("modal");
    const box = document.querySelector(".modal-content");

    document.getElementById("modal-text").innerText = content[id];

    modal.style.display = "flex";

    // reset animation trick
    box.style.animation = "none";
    box.offsetHeight; // force reflow
    box.style.animation = "floatIn 0.45s ease-out forwards";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
